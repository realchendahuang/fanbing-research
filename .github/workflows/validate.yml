name: Validate research repository
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate data and local links
        run: python scripts/research.py validate
      - name: Verify generated views
        run: python scripts/research.py build --check
      - name: Run tests
        run: python -m unittest discover -s tests -v
